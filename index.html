<style>
/* Ein-Spalten-App fürs iPhone, gelber Wegweiser als Leitelement, Tab-Leiste unten */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --line:#D5DCD8; --fg:#15201C; --muted:#5D6B65;
  --fir:#1F6B52; --glacier:#2F6F97; --sign:#F2C200; --sign-ink:#1A1A12;
  --good:#1F7A4D; --warn:#B26B00; --bad:#B3362E;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabh:62px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1613; --surface:#18211D; --line:#2A3631; --fg:#E7EEEA; --muted:#93A39C;
  --fir:#5BBF95; --glacier:#7DB8DE; --good:#5BBF95; --warn:#E3A43C; --bad:#E2685F; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px} h2{font-size:24px} h3{font-size:19px;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sync{font:500 12.5px var(--f-body);color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good)} .dot.warn{background:var(--warn)}
.sign{background:var(--sign);color:var(--sign-ink);border-radius:4px;padding:14px 44px 14px 16px;border:0;font:inherit;text-align:left;width:100%;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%)}
.sign .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sign .dest{font-family:var(--f-display);font-weight:700;font-size:26px}
.sign .t{font-family:var(--f-display);font-weight:700;font-size:40px;font-variant-numeric:tabular-nums}
.sign .sub{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;font:inherit;color:inherit;text-align:left;display:block;width:100%}
button.tile{cursor:pointer}
button.tile:active,.sign:active{transform:scale(.985)}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .d{font-size:12px;margin-top:2px}
.tap{font-size:11.5px;color:var(--muted);margin-top:4px}
.up{color:var(--good)} .down{color:var(--bad)} .muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.seg{display:flex;gap:6px;background:var(--line);padding:3px;border-radius:9px}
.seg button{flex:1;border:0;background:transparent;color:var(--fg);font:600 13px var(--f-body);padding:7px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);
  background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer;width:100%}
.item:first-child{border-top:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
.badge{font-family:var(--f-display);font-weight:700;font-size:17px;text-align:center;border-radius:6px;padding:4px 0;background:var(--bg)}
.badge.sub75{background:var(--sign);color:var(--sign-ink)} .badge.sub80{background:color-mix(in srgb,var(--fir) 22%,var(--bg))}
.item .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .meta{font-size:12.5px;color:var(--muted)}
.item .right{text-align:right}
.item .time{font-family:var(--f-mono);font-size:15px;font-weight:500}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.chip.race{border-color:var(--warn);color:var(--warn)}
label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
input[type=range]{width:100%;accent-color:var(--fir)}
input[type=text],input[type=password],textarea,select{width:100%;font:15px var(--f-mono);padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:76px;resize:vertical;font-size:12px}
.field{display:flex;flex-direction:column;gap:5px}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.status{border-radius:8px;padding:10px 12px;font-size:13.5px;border:1px solid var(--line)}
.status.ok{border-color:var(--good)} .status.edge{border-color:var(--warn)} .status.over{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.zone{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.zone:first-child{border-top:0}
.zbar{height:10px;border-radius:5px}
.btn{border:1px solid var(--fir);background:var(--fir);color:var(--surface);font:600 14px var(--f-body);padding:10px 14px;border-radius:9px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fir)}
.btn:disabled{opacity:.5}
.note{font-size:13px;color:var(--muted);margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;padding:4px 0}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--fir)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:16px 16px 0 0;max-height:90%;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{min-width:0} .kv .k{font-size:11.5px;color:var(--muted)} .kv .v{font-family:var(--f-mono);font-size:15px}
.coach{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--glacier) 6%,var(--surface))}
.coach h4{margin:0;font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.coach p{margin:0} .coach .fazit{font-weight:600}
.coach .blk{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px}
.coach .blk i{width:10px;border-radius:3px}
.coach ul{margin:2px 0 0;padding-left:18px} .coach li{margin:2px 0}
.dbar{height:6px;margin-top:5px;background:var(--line);border-radius:3px;position:relative}
.dbar span{position:absolute;top:0;bottom:0;border-radius:3px}
.dbar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--glacier);margin-right:8px;vertical-align:1px}
.hdr{display:flex;align-items:center;gap:8px;flex:none}
select.pill{width:auto;font:600 12.5px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.goal{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.goal:active{transform:scale(.985)}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .g{font-family:var(--f-display);font-weight:700;font-size:20px}
.goal .bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.goal .bar span{display:block;height:100%;border-radius:4px;background:var(--sign)}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end}
.months .m{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.months .m i{display:block;width:100%;max-width:36px;border-radius:4px 4px 0 0;background:var(--fir);min-height:2px}
.months .m b{font-family:var(--f-mono);font-weight:500;color:var(--fg);font-size:12.5px}
.shead{position:sticky;top:0;z-index:2;background:var(--surface);margin:-10px 0 -4px;padding:10px 0 8px;display:flex;flex-direction:column;gap:6px}
.shead .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead .acts{display:flex;gap:6px;flex:none}
.btn.nav{padding:8px 13px;font-size:17px;line-height:1}
.sheet{overscroll-behavior:contain;outline:0}
.dot.bad{background:var(--bad)}
nav.tabs .ic{position:relative;display:block;line-height:0}
.tdot{position:absolute;top:-3px;right:-7px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
.tdot.live{background:var(--good)} .tdot.warn{background:var(--warn)} .tdot.bad{background:var(--bad)}
.op{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:25px;font-weight:700;line-height:1.15;margin-top:2px}
.op .dot{width:12px;height:12px}
a.btn{text-decoration:none;display:inline-block}
tr.now td{background:color-mix(in srgb,var(--sign) 16%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:13.5px;z-index:40;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}
  .pulse{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Frümsen → Staubern · 1'221 Hm</div>
    <div class="top"><h1 id="pageTitle" style="min-width:0">Übersicht</h1>
    <div class="hdr"><select class="pill" id="seasonSel" aria-label="Saison" hidden></select>
    <button class="sync" id="syncBtn" aria-label="Strava-Verbindung und Aktualisierung"><span class="dot" id="syncDot"></span><span id="syncText">Strava</span></button></div></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Bereiche">
  <a href="#uebersicht" data-v="uebersicht"><svg viewBox="0 0 24 24"><path d="M3 19 9 9l4 6 3-4 5 8z"/></svg>Übersicht</a>
  <a href="#aufstiege" data-v="aufstiege"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg>Aufstiege</a>
  <a href="#rechner" data-v="rechner"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 13l3-3M10 3h4"/></svg>Zielzeit</a>
  <a href="#zonen" data-v="zonen"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Zonen</a>
  <a href="#betrieb" data-v="betrieb" id="opsTab"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7l18-4M12 5v4M7 9h10v7a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zM7 13h10"/></svg><i class="tdot" id="opsDot"></i></span>Bahn</a>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden><div class="inner" id="sheetInner"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ---------- Konstanten ----------
const ROUTE_HM=1221, FIRST_SEASON=2026, EVEREST=8849;
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const LT=156, HFMAX=174;
const ZONES=[["Z1","Erholung","< 120",0,119,"#8FB8A8"],["Z2","Grundlage","120–135",120,135,"#5FA383"],["Z3","Tempo","136–145",136,145,"#E3B83C"],["Z4","Schwelle","146–156",146,156,"#E08A2E"],["Z5","Über Schwelle","157–174",157,174,"#C8463C"]];
const SEGS=[["Talstation - Abzweigung","Start bis Abzweigung","1.0 km · 212 Hm"],["Wadabisser","Wadabisser","0.66 km · 298 Hm"],["Offach Bissa","Offach Bissa","0.69 km · 225 Hm"],["Frümser Alp - Staubern","Frümser Alp bis Staubern","2.07 km · 508 Hm"],["Staubern Finish","Querung ins Ziel","0.59 km · 52 Hm"]];

// ---------- Hilfen ----------
const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const fmtMS=s=>{s=Math.round(Math.abs(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const sgn=d=>d>0?"+":d<0?"−":"±";
const dDE=d=>{const [y,m,t]=d.split("-");return `${t}.${m}.${y}`};
const nf=(v,d=0)=>v==null||isNaN(v)?"–":Number(v).toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}

// ---------- Zustand ----------
// Eine Saison ist ein Kalenderjahr. Gezeigt wird das laufende Jahr, solange es dort Aufstiege gibt, sonst die letzte Saison mit Aufstiegen.
const curSeason=()=>Math.max(FIRST_SEASON,new Date().getFullYear());
const seasons=()=>{const l=[];for(let y=curSeason();y>=FIRST_SEASON;y--)l.push(y);return l};
const seasonActs=y=>store.get("acts:"+y,y===FIRST_SEASON?store.get("acts",[]):[]);
const seasonSynced=y=>store.get("syncedAt:"+y,y===FIRST_SEASON?store.get("syncedAt",null):null);
const autoSeason=()=>seasons().find(y=>seasonActs(y).length)||curSeason();
const state={season:autoSeason(),picked:false,details:store.get("details",{}),sync:"idle",syncMsg:"",
  calcT:store.get("calcT",4380),calcEco:store.get("calcEco",null),chart:store.get("chart","vam"),sort:store.get("sort","datum")};
state.acts=seasonActs(state.season); state.syncedAt=seasonSynced(state.season);
let cfg=store.get("cfg",{});
const idb={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("staubern",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){try{const d=await this.open();return await new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return undefined}},
  async set(k,v){try{const d=await this.open();await new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}};
function saveCfg(){store.set("cfg",cfg);idb.set("cfg",JSON.parse(JSON.stringify(cfg)))}
const connected=()=>!!cfg.refreshToken;

// ---------- Strava ----------
const appUrl=()=>location.origin+location.pathname;
async function tokenRequest(params){
  const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",body:new URLSearchParams(params)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw {status:r.status,msg:j.message||"Anmeldung abgelehnt"};
  return j;
}
function saveTokens(j){cfg={...cfg,accessToken:j.access_token,refreshToken:j.refresh_token||cfg.refreshToken,expiresAt:j.expires_at,athlete:j.athlete?(j.athlete.firstname||""):cfg.athlete};saveCfg()}
async function accessToken(){
  if(cfg.accessToken&&cfg.expiresAt&&cfg.expiresAt-120>Date.now()/1000) return cfg.accessToken;
  const j=await tokenRequest({client_id:cfg.clientId,client_secret:cfg.clientSecret,grant_type:"refresh_token",refresh_token:cfg.refreshToken});
  saveTokens(j); return cfg.accessToken;
}
async function api(path,params={}){
  const tok=await accessToken();
  const u=new URL("https://www.strava.com/api/v3"+path);
  for(const[k,v] of Object.entries(params)) u.searchParams.set(k,v);
  u.searchParams.set("access_token",tok);
  const r=await fetch(u);
  if(r.status===401){cfg.accessToken=null;saveCfg();throw {status:401,msg:"Strava-Zugang abgelaufen. Bitte neu verbinden."}}
  if(r.status===429) throw {status:429,msg:"Strava-Limit erreicht. In 15 Minuten erneut versuchen."};
  if(!r.ok) throw {status:r.status,msg:"Strava antwortet mit Fehler "+r.status+"."};
  return r.json();
}
function isAscent(a){return /staub/i.test(a.name||"")&&(a.total_elevation_gain||0)>=1000}
function slim(a){return {id:String(a.id),name:a.name,start:a.start_date_local,t:a.elapsed_time,mov:a.moving_time,hm:a.total_elevation_gain,km:a.distance/1000,
  hr:a.average_heartrate??null,hrMax:a.max_heartrate??null,temp:a.average_temp??null,wt:a.workout_type??null}}
async function fetchSeason(y){
  let page=1, all=[];
  for(;;){const batch=await api("/athlete/activities",{after:Date.UTC(y,0,1)/1000,before:Date.UTC(y+1,0,1)/1000,per_page:200,page});all=all.concat(batch);if(batch.length<200||page>=5)break;page++}
  const acts=all.filter(isAscent).map(slim).sort((a,b)=>a.start.localeCompare(b.start));
  store.set("acts:"+y,acts); store.set("syncedAt:"+y,Date.now());
  return acts;
}
let syncRun=0;
async function sync(manual){
  if(!connected()||state.sync==="loading") return;
  const run=++syncRun, y=state.season, cur=curSeason();
  state.sync="loading"; renderSync();
  try{
    const acts=await fetchSeason(y); if(run!==syncRun) return;
    state.acts=acts; state.syncedAt=Date.now(); state.sync="live";
    // Wer noch die Vorsaison sieht, wechselt automatisch, sobald es im neuen Jahr den ersten Aufstieg gibt.
    // Umgekehrt zeigt ein leeres neues Jahr die Vorsaison, solange niemand selbst eine Saison gewählt hat.
    if(!state.picked&&y!==cur){const now=await fetchSeason(cur); if(run!==syncRun) return;
      if(now.length){state.season=cur;state.acts=now;toast("Saison "+cur+" gestartet")}}
    else if(!state.picked&&!acts.length&&y>FIRST_SEASON){const old=await fetchSeason(y-1); if(run!==syncRun) return;
      if(old.length){state.season=y-1;state.acts=old}}
    if(manual) toast("Aktualisiert");
  }catch(e){if(run!==syncRun) return;state.sync="warn";state.syncMsg=e.msg||"Keine Verbindung zu Strava."; if(manual) toast(state.syncMsg)}
  renderSync(); render(); if(detailId) paintDetail();
  syncGarmin();
}
function setSeason(y){
  if(y===state.season) return;
  syncRun++; closeSheet();
  state.season=y; state.picked=true; state.acts=seasonActs(y); state.syncedAt=seasonSynced(y); state.sync="idle";
  renderSync(); render(); sync(false);
}
async function detail(id){
  if(state.details[id]) return state.details[id];
  const a=await api("/activities/"+id,{include_all_efforts:true});
  const segs={};for(const s of a.segment_efforts||[]){const n=s.name||s.segment?.name;if(n&&!(n in segs))segs[n]={t:s.elapsed_time,mov:s.moving_time,hr:s.average_heartrate??null}}
  const d={segs,hr:a.average_heartrate??null,hrMax:a.max_heartrate??null};
  state.details[id]=d; store.set("details",state.details); return d;
}
function renderSync(){
  const dot=$("#syncDot"),txt=$("#syncText"),sel=$("#seasonSel"),ys=seasons();
  sel.hidden=!connected()||ys.length<2;
  if(!sel.hidden) sel.innerHTML=ys.map(y=>`<option value="${y}"${y===state.season?" selected":""}>${y}</option>`).join("");
  if(!connected()){dot.className="dot warn";txt.textContent="Verbinden";return}
  dot.className="dot"+(state.sync==="live"?" live":state.sync==="warn"?" warn":"");
  if(state.sync==="loading") txt.textContent="Lädt …";
  else if(state.syncedAt){const t=new Date(state.syncedAt);const today=new Date().toDateString()===t.toDateString();
    txt.textContent=today?t.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}):t.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"})}
  else txt.textContent="Strava";
}

// ---------- Aufbereitung ----------
function ascents(){
  return state.acts.map(a=>{
    const m=(a.name||"").match(/\bV\s?(\d+)\b/i);
    const kind=a.wt===1||/\brun\b|rennen|race/i.test(a.name)?"race":/\b(mit|with)\b/i.test(a.name)?"company":(a.temp!=null&&a.temp>=26)?"heat":"solo";
    const vam=a.hm*3600/a.t;
    return {...a,date:a.start.slice(0,10),time:a.start.slice(11,16),label:m?"V"+m[1]:dDE(a.start.slice(0,10)).slice(0,5),kind,vam,eco:a.hr?vam/a.hr:null};
  });
}
const perf=l=>l.filter(e=>e.kind!=="company");
const byId=id=>ascents().find(e=>e.id===id);

// ---------- Diagramm ----------
const CHART={zeit:["Zeit","Aufstiegszeit",e=>e.t],vam:["VAM","Steigleistung",e=>e.vam],eco:["Ökonomie","Ökonomie",e=>e.eco]};
function chart(list,mode){
  const get=CHART[mode][2], zeit=mode==="zeit", data=perf(list).filter(get);
  if(data.length<2) return `<p class="note">Für den Verlauf braucht es mindestens zwei Aufstiege.</p>`;
  const vals=data.map(get), mn=Math.min(...vals), mx=Math.max(...vals);
  const W=360,H=200,L=36,R=10,T=12,B=26;
  let step,lo,hi;
  if(zeit){step=mx-mn>2700?900:mx-mn>1200?600:300;lo=Math.floor((mn-60)/step)*step;hi=Math.ceil(mx/step)*step}
  else if(mode==="vam"){step=100;lo=Math.min(700,Math.floor(mn/step)*step);hi=Math.max(1000,Math.ceil(mx/step)*step+50)}
  else{step=0.5;lo=Math.min(5,Math.floor(mn/step)*step);hi=Math.max(6.5,Math.ceil(mx/step)*step+0.25)}
  // Bei der Zeit steht die schnellere Zeit oben, damit «besser» in allen drei Ansichten nach oben zeigt
  const x=i=>L+(W-L-R)*(i/(data.length-1)), y=v=>T+(H-T-B)*(zeit?(v-lo)/(hi-lo):1-(v-lo)/(hi-lo));
  const tick=v=>zeit?fmt(v).slice(0,-3):mode==="vam"?v:v.toFixed(1);
  let g="";
  for(let v=lo;v<=(zeit?hi:hi-step/2)+1e-9;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${tick(v)}</text>`;
  if(mode!=="eco"){
    const at=t=>zeit?t:ROUTE_HM*3600/t, goal=state.calcT;
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(at(4800))}" y2="${y(at(4800))}" stroke="var(--fir)" stroke-dasharray="4 3"/><text x="${L+4}" y="${y(at(4800))-4}" style="fill:var(--fir)">Sub-80</text>`;
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(at(4500))}" y2="${y(at(4500))}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${L+4}" y="${y(at(4500))-4}" style="fill:var(--warn)">Sub-75</text>`;
    if(Math.abs(goal-4500)>45&&Math.abs(goal-4800)>45&&at(goal)>=lo&&at(goal)<=hi)
      g+=`<line x1="${L}" x2="${W-R}" y1="${y(at(goal))}" y2="${y(at(goal))}" stroke="var(--fg)" stroke-dasharray="1 3" opacity=".7"/><text x="${(L+W-R)/2}" y="${y(at(goal))-4}" text-anchor="middle" style="fill:var(--fg)">Ziel ${fmt(goal)}</text>`;
  }
  let lastM=null,lastX=-99;
  data.forEach((e,i)=>{const m=e.date.slice(0,7);if(m!==lastM&&x(i)-lastX>24){g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${MON[+e.date.slice(5,7)-1]}</text>`;lastX=x(i)}lastM=m});
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  g+=`<path d="${path} L${pts[pts.length-1][0]} ${H-B} L${pts[0][0]} ${H-B} Z" fill="var(--glacier)" opacity=".10"/><path d="${path}" fill="none" stroke="var(--glacier)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const e=data[i],last=i===pts.length-1,c=e.kind==="race"?"var(--warn)":e.kind==="heat"?"var(--bad)":"var(--glacier)";
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?4.5:3}" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`;
    if(last) g+=`<text x="${p[0]-7}" y="${p[1]+14}" text-anchor="end" style="fill:var(--fg);font-weight:500">${zeit?fmt(vals[i]):mode==="vam"?nf(vals[i]):nf(vals[i],2)}</text>`;
    g+=`<circle class="hit" cx="${p[0]}" cy="${p[1]}" r="11" data-id="${e.id}"/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${CHART[mode][1]} pro Aufstieg">${g}</svg>`;
}

function vUebersicht(){

    ${bestEco?`<button class="tile" data-id="${bestEco.id}"><div class="k">Beste Ökonomie</div><div class="v">${nf(bestEco.eco,2)}</div><div class="d muted">Hm/h je Schlag · ${esc(bestEco.label)}</div><div class="tap">Analyse öffnen ›</div></button>`:`<div class="tile"><div class="k">Beste Ökonomie</div><div class="v">–</div></div>`}
    <div class="tile"><div class="k">Aufstiege</div><div class="v">${l.length}</div><div class="d muted">${sub80} × Sub-80 · ${sub75} × Sub-75</div></div>
    <div class="tile"><div class="k">Höhenmeter</div><div class="v">${nf(hmSum)}</div><div class="d muted">Beste VAM ${nf(bestVam.vam)} Hm/h</div></div>
  </div>
  <section class="panel">
    <div class="top"><h3>${CHART[state.chart][1]}</h3>
      <div class="seg" role="group" aria-label="Kennzahl">${Object.keys(CHART).map(k=>`<button data-chart="${k}" aria-pressed="${state.chart===k}">${CHART[k][0]}</button>`).join("")}</div></div>
    ${chart(l,state.chart)}
    <div class="legend"><span><b style="background:var(--glacier)"></b>Solo</span><span><b style="background:var(--warn)"></b>Wettkampf</span><span><b style="background:var(--bad)"></b>Hitze</span><span>Punkt antippen für Analyse</span></div>

  ${seasonPanel(l)}

function goalRow(best,first){
  const g=state.calcT, gap=best.t-g, span=first.t-g, prog=span>0?Math.max(0,Math.min(1,(first.t-best.t)/span)):1;
  return `<a class="goal" href="#rechner" aria-label="Zielzeit öffnen">
    <div class="row"><span class="g">Ziel ${fmt(g)}</span><span class="${gap<=0?"up":""}">${gap<=0?"erreicht":"noch "+fmtMS(gap)}</span></div>
    <div class="bar"><span style="width:${(prog*100).toFixed(1)}%"></span></div>
    <div class="tap">${gap<=0?`Bestzeit ${fmtMS(gap)} unter dem Ziel. Neues Ziel setzen ›`:first.id===best.id?"Zielzeit anpassen ›":`Vom ersten Aufstieg (${fmt(first.t)}) bis zum Ziel: ${Math.round(prog*100)} % geschafft ›`}</div></a>`;
}
function seasonPanel(l){
  const km=l.reduce((a,e)=>a+e.km,0), sec=l.reduce((a,e)=>a+e.t,0), hm=l.reduce((a,e)=>a+e.hm,0);
  const n={}; l.forEach(e=>{const m=+e.date.slice(5,7);n[m]=(n[m]||0)+1});
  const ms=Object.keys(n).map(Number), mx=Math.max(...Object.values(n)); let bars="";
  for(let m=Math.min(...ms);m<=Math.max(...ms);m++) bars+=`<div class="m"><b>${n[m]||0}</b><i style="height:${Math.round(56*(n[m]||0)/mx)}px"></i><span>${MON[m-1]}</span></div>`;
  return `<section class="panel"><h3>Saison ${state.season}</h3>
    <div class="months" role="img" aria-label="Aufstiege pro Monat: ${ms.sort((a,b)=>a-b).map(m=>MON[m-1]+" "+n[m]).join(", ")}">${bars}</div>
    <div class="kv"><div><div class="k">Distanz</div><div class="v">${nf(km)} km</div></div>
      <div><div class="k">Zeit am Berg</div><div class="v">${Math.floor(sec/3600)} h ${Math.floor(sec%3600/60)} min</div></div>
      <div><div class="k">Mount Everest</div><div class="v">${nf(hm/EVEREST,1)} ×</div></div></div></section>`;
}
function vAufstiege(){

      <span class="right"><span class="time">${fmt(e.t)}</span><br><span class="meta num">${nf(e.vam)} Hm/h</span></span></button>`}).join("")}</div>
   <p class="note">Gelb: unter 75 Minuten. Grün: unter 80 Minuten. Begleitete Touren zählen nicht für Bestzeit und Verlauf.</p>`;

function defaultEco(){const s=perf(ascents()).filter(e=>e.eco);return s.length?Math.round(s[s.length-1].eco*100)/100:6.4}

  <p class="note">Die gewählte Zielzeit gilt auch als Saisonziel in der Übersicht.</p>`;

function calcOut(t,eco){
  const vam=ROUTE_HM*3600/t, hr=vam/eco, level=hr<=153?"ok":hr<=LT?"edge":"over";
  const msg=level==="ok"?"Unter 153 bpm. Machbar bei normaler Tagesform.":level==="edge"?"Knapp unter der Schwelle von 156. Verlangt einen sehr guten Tag und kühle Bedingungen.":"Über der Schwelle von 156 für die ganze Dauer. Nur mit höherer Ökonomie realistisch.";
  const s=perf(ascents()), best=[...s].sort((a,b)=>a.t-b.t)[0], d=best?state.details[best.id]:null;
  let pacing="";
  if(best&&d){const f=t/best.t;
    pacing=`<div><h3 style="margin:8px 0 4px">Pacing pro Abschnitt</h3><p class="note">Abschnittszeiten deiner Bestzeit ${esc(best.label)}, auf die Zielzeit skaliert.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Abschnitt</th><th class="r">${esc(best.label)}</th><th class="r">Ziel</th><th class="r">Δ</th></tr></thead><tbody>
    ${SEGS.filter(x=>d.segs[x[0]]).map(x=>{const st=d.segs[x[0]].t;return `<tr><td>${x[1]}<br><span class="note">${x[2]}</span></td><td class="r num">${fmtMS(st)}</td><td class="r num"><b>${fmtMS(st*f)}</b></td><td class="r num ${f<1?"up":"down"}">${sgn(f-1)}${Math.abs(Math.round(st*(f-1)))} s</td></tr>`}).join("")}
    </tbody></table></div></div>`;}
  else if(best) pacing=dload&&dload.err?`<div class="status edge">${esc(dload.err)}</div>`:`<p class="note"><span class="pulse"></span>Abschnitte der Bestzeit werden von Strava geladen …</p>`;
  return `<div class="result"><div class="tile"><div class="k">Nötige VAM</div><div class="v">${nf(vam)}</div><div class="d muted">Hm/h bei 1'221 Hm</div></div>
    <div class="tile"><div class="k">Nötiger Ø-Puls</div><div class="v">${nf(hr,1)}</div><div class="d muted">Schwelle Gehen: ${LT}</div></div></div>
    <div class="status ${level}">${msg}</div>${pacing}${recordsOut(t,best,d,s)}`;
}
// Schnellste Zeit pro Abschnitt über alle Aufstiege der Saison, deren Abschnitte schon geladen sind
function segRecords(){
  const out={};
  for(const e of perf(ascents())){const d=state.details[e.id]; if(!d) continue;
    for(const [k] of SEGS){const x=d.segs[k]; if(x&&x.t>0&&(!out[k]||x.t<out[k].t)) out[k]={t:x.t,label:e.label}}}
  return out;
}
function recordsOut(t,best,d,s){
  if(!best||!d) return "";
  const rec=segRecords(), have=s.filter(e=>state.details[e.id]).length;
  const rs=SEGS.filter(x=>d.segs[x[0]]&&rec[x[0]]).map(x=>({name:x[1],bt:d.segs[x[0]].t,r:rec[x[0]],gain:d.segs[x[0]].t-rec[x[0]].t}));
  if(!rs.length) return "";
  const gain=rs.reduce((a,x)=>a+x.gain,0), ideal=best.t-gain;
  let msg, cls="ok";
  if(!gain) msg=`Bei ${best.label} warst du in jedem Abschnitt so schnell wie nie zuvor.`;
  else{msg=`Alle Rekorde am selben Tag ergäben rund ${fmt(ideal)}, das sind ${fmtMS(gain)} weniger als bei ${best.label}.`;
    if(t<best.t){ if(ideal<=t) msg+=` Das Ziel ${fmt(t)} liegt damit in Reichweite.`;
      else{msg+=` Bis ${fmt(t)} fehlen dann noch ${fmtMS(ideal-t)}; dafür braucht es neue Abschnitts-Rekorde.`;cls="edge"}}}
  const prog=dload&&dload.busy?`<p class="note"><span class="pulse"></span>Abschnitte werden geladen: ${have} von ${s.length} Aufstiegen …</p>`
    :have<s.length?`<p class="note">${dload&&dload.err?esc(dload.err)+" ":""}Rekorde aus ${have} von ${s.length} Aufstiegen.</p>`:"";
  return `<div><h3 style="margin:8px 0 4px">Abschnitts-Rekorde</h3><p class="note">Deine schnellste Zeit pro Abschnitt in der Saison ${state.season}, verglichen mit der Bestzeit ${esc(best.label)}.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Abschnitt</th><th class="r">${esc(best.label)}</th><th class="r">Rekord</th><th class="r">Potenzial</th></tr></thead><tbody>

let refPick=null;
function refFor(e){
  const s=perf(ascents()).filter(x=>x.id!==e.id), p=refPick&&s.find(x=>x.id===refPick);
  if(p) return {ref:p,role:"zum Aufstieg",custom:true};
  const c=s.sort((a,b)=>a.t-b.t)[0];
  return c?{ref:c,role:e.t<c.t?"zur bisherigen Bestzeit":"zur Bestzeit"}:null;
}
function rows(d,rd){
  return SEGS.filter(s=>d.segs[s[0]]).map(s=>{const a=d.segs[s[0]],b=rd?.segs[s[0]];return {name:s[1],info:s[2],t:a.t,stop:a.t-a.mov,hr:a.hr,
    rt:b?.t??null,rstop:b?b.t-b.mov:null,rhr:b?.hr??null,d:b?a.t-b.t:null,hrd:(b?.hr&&a.hr)?Math.round(a.hr-b.hr):null}});
}
function analyze(e,r,d,rd){
  const rs=rows(d,rd).filter(x=>x.d!=null), ref=r.ref, total=e.t-ref.t;
  const hr=d.hr??e.hr, rhr=rd.hr??ref.hr, eco=hr?e.vam/hr:null, reco=rhr?ref.vam/rhr:null;
  let fazit = total<0?`${r.custom?"":"Neue Bestzeit: "}${fmtMS(total)} schneller als ${ref.label}.`:total<=30?`Fast auf Bestzeit-Niveau, nur ${total} s hinter ${ref.label}.`:`${fmtMS(total)} langsamer als ${ref.label}.`;
  if(eco&&reco){ if(eco<reco-0.15) fazit+=` Mehr Puls bei weniger Tempo: Die Ökonomie fiel von ${reco.toFixed(2)} auf ${eco.toFixed(2)}.`;
    else if(eco>reco+0.1) fazit+=` Die Ökonomie war mit ${eco.toFixed(2)} besser als bei ${ref.label} (${reco.toFixed(2)}).`;
    else fazit+=` Die Ökonomie lag mit ${eco.toFixed(2)} nahe an ${ref.label} (${reco.toFixed(2)}).`; }
  const gut=[];
  rs.filter(x=>x.d<=5).sort((a,b)=>a.d-b.d).slice(0,2).forEach(x=>gut.push(`${x.name}: ${x.d<0?fmtMS(x.d)+" schneller":x.d===0?"gleich schnell":"nur +"+x.d+" s"} als ${ref.label}${x.hrd!=null&&x.hrd<=-2?`, bei ${-x.hrd} Schlägen weniger`:""}.`));
  if(!gut.length&&rs.length){const x=[...rs].sort((a,b)=>a.d-b.d)[0];gut.push(`Am nächsten an der Referenz: ${x.name} (+${x.d} s).`)}
  if(hr&&rhr&&hr<=rhr-2) gut.push(`Ø-Puls ${Math.round(hr)} bpm, ${Math.round(rhr-hr)} Schläge tiefer als bei ${ref.label}.`);
  const s=perf(ascents()).filter(x=>x.eco); if(eco&&s.length&&eco>=Math.max(...s.map(x=>x.eco))-0.005) gut.push("Beste Ökonomie der Saison.");
  const verloren=rs.filter(x=>x.d>10).sort((a,b)=>b.d-a.d).slice(0,3).map(x=>{
    const pd=x.rstop!=null?x.stop-x.rstop:0;
    let why=pd>=20?`, davon rund ${pd} s mehr Stillstand laut Strava`:x.hrd!=null&&x.hrd>=2?`, trotz ${x.hrd} Schlägen mehr Puls`:x.hrd!=null&&x.hrd<=-2?`, mit ${-x.hrd} Schlägen weniger Puls (Reserve vorhanden)`:"";
    return `${x.name}: +${x.d} s${why}.`});
  if(!verloren.length) verloren.push("In keinem Abschnitt mehr als 10 s hinter der Referenz.");
  const worst=rs.filter(x=>x.d>10).sort((a,b)=>b.d-a.d)[0];
  let next;
  if(hr&&hr>LT) next=`Der Ø-Puls lag mit ${Math.round(hr)} über der Schwelle von ${LT}. Unten kontrollierter starten und bis zur Abzweigung höchstens ${LT-6} bpm halten.`;
  else if(worst) next=`Im Abschnitt ${worst.name} auf ${fmtMS(worst.rt)} zielen wie bei ${ref.label}${worst.hrd!=null&&worst.hrd<=-2?"; der Puls lässt dort Spielraum":worst.rstop!=null&&worst.stop-worst.rstop>=20?" und Stopps dort kurz halten":""}.`;
  else next=`Das Tempo passt. Im oberen Teil den Puls bis ${LT+2} steigen lassen, um weitere Sekunden zu holen.`;
  const ctx=[], gc=gContext(e), gr=gContext(ref);
  if(gc&&gr){
    if(gc.load7>gr.load7*1.3&&gc.load7-gr.load7>100) ctx.push(`Mehr Belastung in den 7 Tagen davor: Trainingslast ${Math.round(gc.load7)} statt ${Math.round(gr.load7)} vor ${ref.label}.`);
    else if(gc.load7<gr.load7*0.7&&gr.load7-gc.load7>100) gut.push(`Ausgeruhter gestartet: Trainingslast der 7 Tage davor ${Math.round(gc.load7)} statt ${Math.round(gr.load7)}.`);
  }
  if(gc&&gc.daysSince!=null&&gc.daysSince<2.5) ctx.push(`Nur ${nf(gc.daysSince,1)} Tage seit der letzten harten Einheit.`);
  if(ctx.length&&total>30) next="Vor dem nächsten Bestzeitversuch zwei ruhige Tage einplanen. "+next;
  return {fazit,gut,verloren,next,ctx};
}

const GSTART="2026-05-01";

const ymd=d=>d.toISOString().slice(0,10);
const tLocal=s=>new Date(String(s).slice(0,19)+"Z").getTime();
async function syncGarmin(){
  if(!garminOn()||state.gbusy) return; state.gbusy=true;
  try{
    let all=[];
    for(let s=0;s<500;s+=100){const b=await garmin(`/activitylist-service/activities/search/activities?start=${s}&limit=100&startDate=${GSTART}`);if(!Array.isArray(b))break;all=all.concat(b);if(b.length<100)break}
    state.gacts=all.map(a=>({id:a.activityId,start:String(a.startTimeLocal||"").replace(" ","T").slice(0,19),type:(a.activityType&&a.activityType.typeKey)||"",load:a.activityTrainingLoad??null,ate:a.aerobicTrainingEffect??null,ante:a.anaerobicTrainingEffect??null,z:[1,2,3,4,5].map(i=>a["hrTimeInZone_"+i]??null),bb:a.differenceBodyBattery??null,resp:a.avgRespirationRate??null}));
    store.set("gacts",state.gacts);
    const have=Object.keys(state.gdays).sort(), start=new Date(GSTART+"T12:00:00Z"), to=new Date();
    let a=have.length?new Date(have[have.length-1]+"T12:00:00Z"):start; a.setUTCDate(a.getUTCDate()-3); if(a<start)a=start;
    for(;a<=to;a.setUTCDate(a.getUTCDate()+28)){
      const b=new Date(a);b.setUTCDate(b.getUTCDate()+27);if(b>to)b.setTime(to.getTime());
      const r=await garmin(`/usersummary-service/v2/dailysummaries?startDate=${ymd(a)}&endDate=${ymd(b)}`);
      for(const x of (r&&r.data)||[]) state.gdays[x.calendarDate]={rhr:x.heartRate?.restingValue??null,bbMax:x.bodyBattery?.maxValue??null,bbMin:x.bodyBattery?.minValue??null,stress:(x.stress&&x.stress.avgLevel>=0)?x.stress.avgLevel:null};
    }
    store.set("gdays",state.gdays); state.gerr=null;
  }catch(e){state.gerr=e.msg||"Garmin nicht erreichbar"}
  state.gbusy=false; if(detailId) paintDetail();
}
function gContext(e){
  if(!garminOn()||(!state.gacts.length&&!Object.keys(state.gdays).length)) return null;
  const t0=tLocal(e.start);
  const m=state.gacts.map(a=>({a,d:Math.abs(tLocal(a.start)-t0)})).sort((x,y)=>x.d-y.d)[0];
  const ga=m&&m.d<20*60e3?m.a:null;
  const before=state.gacts.filter(a=>{const t=tLocal(a.start);return t<t0-60e3&&t>=t0-7*864e5});
  const load7=before.reduce((s,a)=>s+(a.load||0),0);
  const hard=state.gacts.filter(a=>tLocal(a.start)<t0-60e3&&((a.load||0)>=150||(a.ate||0)>=4)).sort((x,y)=>y.start.localeCompare(x.start))[0];
  const daysSince=hard?(t0-tLocal(hard.start))/864e5:null;
  const day=state.gdays[e.date]||{};
  const rhrs=Object.values(state.gdays).map(d=>d.rhr).filter(Boolean).sort((a,b)=>a-b);
  return {ga,load7,daysSince,rhr:day.rhr??null,rhrMed:rhrs.length?rhrs[Math.floor(rhrs.length/2)]:null,bbMax:day.bbMax??null};
}

      return `<tr><td><b>${esc(x.name)}</b><br><span class="note">${x.hr?"Ø "+Math.round(x.hr)+" bpm":""}${x.hrd!=null?` (${x.hrd>0?"+":""}${x.hrd})`:""}${x.stop>20?` · ${x.stop} s Pause`:""}</span>
        ${x.d!=null?`<div class="dbar"><span style="background:${col};${x.d>0?"left:50%":"right:50%"};width:${w}%"></span></div>`:""}</td>
        <td class="r num">${fmtMS(x.t)}</td><td class="r num ${x.d>0?"down":x.d<0?"up":""}">${x.d==null?"–":sgn(x.d)+Math.abs(x.d)+" s"}</td></tr>`}).join("")}</tbody></table></div>
      <p class="note">Abschnitte überlappen teilweise und ergeben zusammen nicht die Gesamtzeit. Pause: Zeit, die Strava als Stillstand zählt, auch sehr langsames Steigen.</p>`
      :`<p class="note">Strava hat für diesen Aufstieg keine passenden Abschnitte erkannt.</p>`;
    body=`${coach}<div><h3 style="margin-bottom:6px">Abschnitte${r?` <span class="note" style="font-family:var(--f-body);font-weight:400">im Vergleich ${esc(r.role)} ${esc(r.ref.label)} (${fmt(r.ref.t)})</span>`:""}</h3>${table}</div>`;
  }
  const dRef=r?e.t-r.ref.t:e.t-4500;
  const all=ascents(), ix=all.findIndex(x=>x.id===e.id), older=all[ix-1], newer=all[ix+1];
  const ranked=perf(all).sort((a,b)=>a.t-b.t), rank=ranked.findIndex(x=>x.id===e.id)+1;
  const others=ranked.filter(x=>x.id!==e.id), fastest=others[0];
  const refSel=others.length>1?`<div class="field"><label for="refSel">Vergleichen mit</label><select id="refSel">
      <option value="">${e.t<fastest.t?"Bisherige Bestzeit":"Bestzeit"} · ${esc(fastest.label)} · ${fmt(fastest.t)}</option>
      ${others.filter(x=>x.id!==fastest.id).sort((a,b)=>b.start.localeCompare(a.start)).map(x=>`<option value="${x.id}"${r&&r.custom&&r.ref.id===x.id?" selected":""}>${esc(x.label)} · ${dDE(x.date).slice(0,6)} · ${fmt(x.t)}</option>`).join("")}</select></div>`:"";
  $("#sheetInner").innerHTML=`<div class="shead"><div class="grab"></div>
    <div class="bar"><div class="eyebrow" style="min-width:0">${esc(e.label)} · ${dDE(e.date)} · ${e.time}</div>
      <div class="acts"><button class="btn ghost nav" id="olderBtn" aria-label="Älterer Aufstieg"${older?"":" disabled"}>‹</button><button class="btn ghost nav" id="newerBtn" aria-label="Neuerer Aufstieg"${newer?"":" disabled"}>›</button><button class="btn ghost" id="closeSheet">Schliessen</button></div></div></div>
    <h2>${esc(e.name)}</h2>
    <div class="kv">
      <div><div class="k">Zeit</div><div class="v">${fmt(e.t)}</div></div>
      <div><div class="k">${r?"Δ "+esc(r.ref.label):"Sub-75 Δ"}</div><div class="v ${dRef<=0?"up":"down"}">${sgn(dRef)}${fmtMS(dRef)}</div></div>
      <div><div class="k">VAM</div><div class="v">${nf(e.vam)}</div></div>
      <div><div class="k">Ø / Max HF</div><div class="v">${hr?nf(hr):"–"} / ${hrMax??"–"}</div></div>
      <div><div class="k">Ökonomie</div><div class="v">${nf(eco,2)}</div></div>
      <div><div class="k">Höhenmeter</div><div class="v">${nf(e.hm)}</div></div>
      <div><div class="k">Stillstand</div><div class="v">${e.t-e.mov>0?fmtMS(e.t-e.mov):"–"}</div></div>
      <div><div class="k">Temperatur</div><div class="v">${e.temp!=null?nf(e.temp)+" °C":"–"}</div></div>
      <div><div class="k">Rang ${state.season}</div><div class="v">${rank?rank+" / "+ranked.length:"–"}</div></div>
    </div>${refSel}${tagesform(e,r)}${body}`;
  $("#closeSheet").onclick=closeSheet;
  if(older) $("#olderBtn").onclick=()=>openDetail(older.id);
  if(newer) $("#newerBtn").onclick=()=>openDetail(newer.id);
  const sel=$("#refSel"); if(sel) sel.onchange=()=>{refPick=sel.value||null;paintDetail();loadRef(e.id)};
}
function closeSheet(){
  $("#sheet").hidden=true;$("#backdrop").hidden=true;detailId=null;refPick=null;
  document.documentElement.style.overflow="";
  if(lastFocus&&lastFocus.isConnected){try{lastFocus.focus({preventScroll:true})}catch(e){}} lastFocus=null;
}

// ---------- Verbindung ----------
function setupCode(){return btoa(JSON.stringify({i:cfg.clientId,s:cfg.clientSecret,r:cfg.refreshToken,gu:cfg.garminUrl||undefined,gk:cfg.garminKey||undefined}))}
const garminOn=()=>!!(cfg.garminUrl&&cfg.garminKey);
async function garmin(path){
  const r=await fetch(cfg.garminUrl.replace(/\/$/,"")+path,{headers:{"X-App-Key":cfg.garminKey}});
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw {status:r.status,msg:(j&&j.error)||("Garmin-Fehler "+r.status)};
  return j;
}
function openConnection(){
  showSheet();detailId=null;
  $("#sheetInner").innerHTML=`<div class="shead"><div class="grab"></div><div class="bar"><h2>Strava</h2><button class="btn ghost" id="closeSheet">Schliessen</button></div></div>
    <p class="note">Verbunden${cfg.athlete?" als "+esc(cfg.athlete):""}. ${state.syncedAt?"Zuletzt aktualisiert: "+new Date(state.syncedAt).toLocaleString("de-CH",{dateStyle:"short",timeStyle:"short"})+".":""}</p>
    <button class="btn" id="refreshBtn">Jetzt aktualisieren</button>
    <div class="panel"><h3>Einrichtungscode</h3><p class="note">Damit verbindest du die App auf dem Home-Bildschirm oder einem anderen Gerät, ohne dich neu anzumelden. Behandle ihn wie ein Passwort.</p>
      <textarea readonly id="codeOut">${setupCode()}</textarea><button class="btn ghost" id="copyBtn">Code kopieren</button></div>
    <div class="panel"><h3>Garmin</h3><p class="note">Adresse deines Cloudflare-Workers und der App-Schlüssel, den du dort als APP_KEY hinterlegt hast.</p>
      <div class="field"><label for="gUrl">Worker-Adresse</label><input type="text" id="gUrl" autocomplete="off" placeholder="https://….workers.dev" value="${esc(cfg.garminUrl||"")}"></div>
      <div class="field"><label for="gKey">App-Schlüssel</label><input type="password" id="gKey" autocomplete="off" value="${esc(cfg.garminKey||"")}"></div>
      <button class="btn ghost" id="gSave">Speichern und testen</button><p class="note" id="gMsg">${garminOn()?"Garmin ist eingerichtet.":""}</p></div>
    <button class="btn ghost" id="logoutBtn" style="border-color:var(--bad);color:var(--bad)">Verbindung trennen</button>`;
  $("#closeSheet").onclick=closeSheet;
  $("#gSave").onclick=async()=>{cfg.garminUrl=$("#gUrl").value.trim();cfg.garminKey=$("#gKey").value.trim();saveCfg();const m=$("#gMsg");
    if(!garminOn()){m.textContent="Garmin ist ausgeschaltet.";return}
    m.textContent="Teste Verbindung …";try{await garmin("/ping");m.textContent="Verbunden mit Garmin.";syncGarmin()}catch(e){m.textContent=e.msg||"Worker nicht erreichbar. Adresse prüfen."}};
  $("#refreshBtn").onclick=()=>{closeSheet();sync(true)};
  $("#copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(setupCode());toast("Code kopiert")}catch(e){const t=$("#codeOut");t.focus();t.select()}};
  $("#logoutBtn").onclick=()=>{if($("#logoutBtn").dataset.sure){cfg={};store.del("cfg");idb.set("cfg",{});try{Object.keys(localStorage).filter(k=>/^(acts|syncedAt)(:|$)/.test(k)).forEach(k=>store.del(k))}catch(e){}store.del("details");state.acts=[];state.details={};state.syncedAt=null;closeSheet();renderSync();render()}
    else{$("#logoutBtn").dataset.sure="1";$("#logoutBtn").textContent="Wirklich trennen? Nochmals tippen"}};
}
async function finishOAuth(){
  const q=new URLSearchParams(location.search), code=q.get("code"), err=q.get("error");
  if(err){history.replaceState(null,"",appUrl()+location.hash);return "Strava-Zugriff wurde nicht erlaubt."}
  if(!code) return null;
  if(!(q.get("scope")||"").includes("activity:read")){history.replaceState(null,"",appUrl());return "Bitte beim Verbinden «Aktivitäten ansehen» erlauben."}
  if(!cfg.clientId||!cfg.clientSecret) return "need-secret";
  try{const j=await tokenRequest({client_id:cfg.clientId,client_secret:cfg.clientSecret,code,grant_type:"authorization_code"});
    saveTokens(j); history.replaceState(null,"",appUrl()); return "ok";}
  catch(e){history.replaceState(null,"",appUrl());return "Verbindung fehlgeschlagen: "+(e.msg||"unbekannter Fehler")+". Client ID und Secret prüfen."}
}
function bindSetup(){
  const btn=$("#connectBtn"); if(!btn) return;
  btn.onclick=async()=>{
    cfg.clientId=$("#cid").value.trim(); cfg.clientSecret=$("#csec").value.trim(); saveCfg();
    if(!cfg.clientId||!cfg.clientSecret){$("#setupMsg").textContent="Bitte Client ID und Client Secret eingeben.";return}
    if(new URLSearchParams(location.search).get("code")){btn.disabled=true;const res=await finishOAuth();btn.disabled=false;afterConnect(res);return}
    const u=new URL("https://www.strava.com/oauth/authorize");
    u.search=new URLSearchParams({client_id:cfg.clientId,response_type:"code",redirect_uri:appUrl(),approval_prompt:"auto",scope:"read,activity:read_all"});
    location.href=u.toString();
  };
  $("#codeBtn").onclick=()=>{
    try{const o=JSON.parse(atob($("#codeIn").value.trim()));if(!o.i||!o.s||!o.r) throw 0;
      cfg={clientId:String(o.i),clientSecret:o.s,refreshToken:o.r,garminUrl:o.gu,garminKey:o.gk};saveCfg();afterConnect("ok")}
    catch(e){toast("Dieser Code ist ungültig.")}
  };
}
function afterConnect(res){
  if(res==="ok"){toast("Mit Strava verbunden");renderSync();render();sync(false);
    if(!navigator.standalone&&!matchMedia("(display-mode: standalone)").matches) setTimeout(openConnection,600);}
  else if(res&&res!=="need-secret"){render();const m=$("#setupMsg");if(m)m.textContent=res}
}

// ---------- Router ----------
const VIEWS={uebersicht:["Übersicht",vUebersicht],aufstiege:["Aufstiege",vAufstiege],rechner:["Zielzeit",vRechner],zonen:["Zonen",vZonen],betrieb:["Bahn und Gasthaus",vBetrieb]};
const current=()=>{const h=location.hash.slice(1);return VIEWS[h]?h:"uebersicht"};
function render(){
  if(!connected()){$("#pageTitle").textContent="Einrichten";$("#view").innerHTML=`<div class="wrap" style="max-width:none">${vSetup()}</div>`;bindSetup();
    document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current","false"));return}
  const v=current();
  $("#pageTitle").textContent=VIEWS[v][0];
  $("#view").innerHTML=`<div class="wrap" style="max-width:none">${VIEWS[v][1]()}</div>`;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  document.querySelectorAll("[data-chart]").forEach(b=>b.onclick=()=>{state.chart=b.dataset.chart;store.set("chart",state.chart);render()});
  document.querySelectorAll("#view [data-id]").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;store.set("sort",state.sort);render()});
  if(v==="rechner") loadAllDetails();
  if(v==="betrieb"){syncOps(false);$("#opsRefresh").onclick=()=>syncOps(true)}
  const ct=$("#calcT"),ce=$("#calcEco");
  if(ct){const upd=()=>{state.calcT=+ct.value;state.calcEco=+ce.value;store.set("calcT",state.calcT);store.set("calcEco",state.calcEco);
    $("#calcTv").textContent=fmt(state.calcT);$("#calcEv").textContent=state.calcEco.toFixed(2);$("#calcOut").innerHTML=calcOut(state.calcT,state.calcEco)};ct.oninput=upd;ce.oninput=upd}
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{state.calcT=+b.dataset.preset;store.set("calcT",state.calcT);render()});
}
addEventListener("hashchange",()=>{closeSheet();render();scrollTo(0,0)});
$("#backdrop").onclick=closeSheet;
$("#seasonSel").onchange=ev=>setSeason(+ev.target.value);
$("#syncBtn").onclick=()=>connected()?openConnection():(location.hash="",render());
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeSheet()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&connected()&&(!state.syncedAt||Date.now()-state.syncedAt>10*60e3))sync(false);
  if(document.visibilityState==="visible") syncOps(false)});

(async()=>{
  if(!connected()){const c=await idb.get("cfg");if(c&&c.refreshToken){cfg=c;store.set("cfg",cfg)}}
  else idb.set("cfg",JSON.parse(JSON.stringify(cfg)));
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render(); renderSync(); syncOps(false);
  const res=await finishOAuth();
  if(res) afterConnect(res);
  else if(connected()) sync(false);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
